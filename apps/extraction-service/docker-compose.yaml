services:
  extraction-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: extraction-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"