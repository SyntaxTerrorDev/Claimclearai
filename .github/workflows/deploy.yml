name: Deploy Extraction Service

on:
  push:
    branches:
      - main
      - deploying
    paths:
      - 'apps/extraction-service/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Legacy Systemd Service (If Running)
        run: |
          sudo systemctl stop extraction-service || true
          sudo systemctl disable extraction-service || true

      - name: Build and Deploy via Docker Compose
        working-directory: ./apps/extraction-service
        run: |
          # Build the new image and recreate the container without downtime
          docker compose up -d --build
          
          # Clean up old dangling images to save server disk space
          docker image prune -f