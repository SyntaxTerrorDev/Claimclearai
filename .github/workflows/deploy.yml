name: Deploy Extraction Service

on:
  push:
    branches:
      - main
      - deploying

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Environment Variables
        run: |
          # Copy the persistent env file from the home directory into the app directory
          cp ~/extraction.env apps/extraction-service/.env

      - name: Build and Deploy via Docker Compose
        working-directory: ./apps/extraction-service
        run: |
          docker compose up -d --build
          docker image prune -f